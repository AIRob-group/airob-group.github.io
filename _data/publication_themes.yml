# Titles count three times as much as abstracts. Phrases match whole words.
# Add `themes = {id, another-id},` to a BibTeX entry to override classification.
# Related robotics themes use warm hues: red/rose for planning, coral for
# execution, orange/gold for coordination and coverage. Cross-cutting methods
# use contrasting hues: blue for learning, teal for optimization, violet for theory.
